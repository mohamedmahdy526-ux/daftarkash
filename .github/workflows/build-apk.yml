name: Build Native Android APK (دفتر كاش)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Native Android APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DaftarKash-Native.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaftarKash-Native-APK
          path: DaftarKash-Native.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: DaftarKash-Native.apk
          tag_name: v2.0.${{ github.run_number }}
          name: "دفتر كاش - تطبيق أندرويد الأصلي Native v2.0.${{ github.run_number }}"
          body: |
            ### 📱 تطبيق دفتر كاش للأندرويد (النسخة الأصلية Native Kotlin)
            * مبني 100% بنظام **Android Native (Kotlin + Jetpack Compose + Room DB + CameraX)**.
            * **اللوجو الجديد 3D** تم دمجه كأيقونة رسمية للتطبيق وشريط العنوان.
            * **المزامنة الثنائية (Two-Way Sync)** مع Google Sheets.
            * دعم مسح الباركود بالكاميرا، الصوت والاهتزاز، واستيراد جهات الاتصال.
            
            📥 **طريقة التثبيت:** حمّل ملف `DaftarKash-Native.apk` المرفق وثبّته مباشرة على هاتفك!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
