name: Build Android APK (دفتر كاش)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build DaftarKash Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM & Capacitor
        run: |
          npm install

      - name: Prepare Web Assets in www
        run: |
          mkdir -p www
          cp -r index.html style.css app.js manifest.json icon.jpg icon-192.png icon-512.png www/

      - name: Initialize Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaftarKash-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: "دفتر كاش - نسخة أندرويد الرسمية APK v1.0.0"
          body: |
            ### 📱 تطبيق دفتر كاش للأندرويد (DaftarKash APK)
            * تطبيق أصلي سريع يعمل بدون إنترنت مع مزامنة سحابية فورية.
            * دعم مسح الباركود بالكاميرا وإدارة الديون وحسابات المحلات.
            * حمل الملف أدناه `app-debug.apk` وثبته على هاتفك مباشرة!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
