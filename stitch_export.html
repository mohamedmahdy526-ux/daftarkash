<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>دفتر كاش | Google Stitch UI Export</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

    :root {
      --font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg-main: #0A0E17;
      --bg-card: #121826;
      --bg-card-elevated: #1A2234;
      --bg-input: #161F31;
      --bg-input-focus: #1C283F;
      --border-color: rgba(255, 255, 255, 0.07);
      --border-focus: #3B82F6;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --primary: #3B82F6;
      --primary-gradient: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
      --primary-light: rgba(59, 130, 246, 0.12);
      --success: #10B981;
      --success-gradient: linear-gradient(135deg, #10B981 0%, #047857 100%);
      --success-light: rgba(16, 185, 129, 0.12);
      --danger: #EF4444;
      --danger-gradient: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%);
      --danger-light: rgba(239, 68, 68, 0.12);
      --warning: #F59E0B;
      --warning-light: rgba(245, 158, 11, 0.12);
      --whatsapp: #22C55E;
      --whatsapp-light: rgba(34, 197, 94, 0.12);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.15);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
      --shadow-glow-primary: 0 4px 16px rgba(59, 130, 246, 0.3);
      --shadow-glow-danger: 0 4px 16px rgba(239, 68, 68, 0.3);
      --shadow-glow-success: 0 4px 16px rgba(16, 185, 129, 0.3);
      --header-height: 58px;
      --bottom-nav-height: 62px;
      --container-max-width: 480px;
    }

    *, *::before, *::after,
    body, button, input, select, textarea, h1, h2, h3, h4, h5, h6, p, span, a, label {
      box-sizing: border-box;
      font-family: 'Cairo', system-ui, sans-serif !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      direction: rtl;
      min-height: 100vh;
      padding-top: var(--header-height);
      padding-bottom: calc(var(--bottom-nav-height) + 20px);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .metric-value-mini, .balance-tag, .tx-amount, .huge-amount-input {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    .app-header {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: var(--header-height);
      background-color: rgba(18, 24, 38, 0.92);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      z-index: 100;
    }

    .header-content {
      max-width: var(--container-max-width);
      margin: 0 auto;
      height: 100%;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-img-logo {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .store-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .status-text {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .cloud-sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      padding: 5px 9px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .cloud-sync-pill .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--success);
    }

    .main-container {
      max-width: var(--container-max-width);
      margin: 0 auto;
      padding: 10px 12px;
    }

    /* 3-Column Metrics */
    .metrics-banner-compact {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric-card-compact {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px;
      box-shadow: var(--shadow-sm);
    }

    .metric-card-compact.danger-accent { border-right: 3px solid var(--danger); }
    .metric-card-compact.success-accent { border-right: 3px solid var(--success); }
    .metric-card-compact.primary-accent { border-right: 3px solid var(--primary); }

    .metric-header-mini {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-value-mini {
      font-size: 1.22rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .metric-value-mini.text-danger { color: var(--danger); }
    .metric-value-mini.text-success { color: var(--success); }
    .metric-value-mini.text-primary { color: var(--primary); }

    .currency-unit-mini {
      font-size: 0.65rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    /* Search & Add */
    .search-action-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrapper input {
      width: 100%;
      height: 44px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0 40px 0 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-icon {
      position: absolute;
      right: 12px;
      width: 18px;
      height: 18px;
      color: var(--text-dim);
    }

    .add-cust-icon-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      background: var(--primary-gradient);
      border: none;
      border-radius: var(--radius-sm);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-glow-primary);
    }

    /* Filter Chips */
    .filter-chips {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .chip-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip-btn.active {
      background-color: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Customers List */
    .customers-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .customer-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    .customer-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .customer-last-tx {
      font-size: 0.74rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .balance-tag {
      font-size: 1.2rem;
      font-weight: 900;
      direction: ltr;
    }

    .balance-tag.debt { color: var(--danger); }
    .balance-tag.settled { color: var(--success); }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      right: 0;
      left: 0;
      height: var(--bottom-nav-height);
      background-color: rgba(18, 24, 38, 0.94);
      border-top: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: var(--container-max-width);
      margin: 0 auto;
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-content">
      <div class="brand-section">
        <img src="icon.jpg" alt="Logo" class="brand-img-logo">
        <div>
          <h1 class="store-title">بقالة البركة</h1>
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-text">شغال بدون نت (محلي)</span>
          </div>
        </div>
      </div>
      <div class="cloud-sync-pill">
        <span class="sync-dot"></span>
        <i data-lucide="cloud" style="width: 15px; height: 15px;"></i>
        <span>متزامن ☁️</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">

    <!-- 3-Column Metrics Banner -->
    <div class="metrics-banner-compact">
      <div class="metric-card-compact danger-accent">
        <div class="metric-header-mini">
          <i data-lucide="coins" style="width:14px;height:14px;"></i>
          <span>فلوس السوق</span>
        </div>
        <div class="metric-value-mini text-danger">
          1,850 <span class="currency-unit-mini">ج.م</span>
        </div>
      </div>

      <div class="metric-card-compact success-accent">
        <div class="metric-header-mini">
          <i data-lucide="banknote" style="width:14px;height:14px;"></i>
          <span>تحصيل اليوم</span>
        </div>
        <div class="metric-value-mini text-success">
          400 <span class="currency-unit-mini">ج.م</span>
        </div>
      </div>

      <div class="metric-card-compact primary-accent">
        <div class="metric-header-mini">
          <i data-lucide="users" style="width:14px;height:14px;"></i>
          <span>المدينون</span>
        </div>
        <div class="metric-value-mini text-primary">
          2 <span class="currency-unit-mini">عميل</span>
        </div>
      </div>
    </div>

    <!-- Search & Action Row -->
    <div class="search-action-row">
      <div class="search-input-wrapper">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" placeholder="ابحث باسم العميل...">
      </div>
      <button class="add-cust-icon-btn">
        <i data-lucide="plus"></i>
      </button>
    </div>

    <!-- Filter Chips -->
    <div class="filter-chips">
      <button class="chip-btn active">الكل (3)</button>
      <button class="chip-btn">عليهم فلوس (2)</button>
      <button class="chip-btn">خالصين (1)</button>
      <button class="chip-btn">الأعلى ديناً ⬇️</button>
    </div>

    <!-- Customers List -->
    <div class="customers-list">
      <div class="customer-card">
        <div class="customer-info">
          <h4 class="customer-name">أحمد محمود عبد الرحمن</h4>
          <div class="customer-last-tx">
            <i data-lucide="clock" style="width:12px;height:12px;"></i> منذ ساعتين
          </div>
        </div>
        <div class="balance-tag debt">
          650 <span class="currency-unit-mini">ج.م</span>
        </div>
      </div>

      <div class="customer-card">
        <div class="customer-info">
          <h4 class="customer-name">مصطفى علي كامل</h4>
          <div class="customer-last-tx">
            <i data-lucide="clock" style="width:12px;height:12px;"></i> أمس
          </div>
        </div>
        <div class="balance-tag debt">
          1,200 <span class="currency-unit-mini">ج.م</span>
        </div>
      </div>

      <div class="customer-card">
        <div class="customer-info">
          <h4 class="customer-name">إبراهيم حسن النجار</h4>
          <div class="customer-last-tx">
            <i data-lucide="clock" style="width:12px;height:12px;"></i> منذ 3 أيام
          </div>
        </div>
        <div class="balance-tag settled">
          0 <span class="currency-unit-mini">ج.م</span>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <i data-lucide="users"></i>
      <span>الحسابات</span>
    </button>
    <button class="nav-item">
      <i data-lucide="zap"></i>
      <span>تسجيل سريع</span>
    </button>
    <button class="nav-item">
      <i data-lucide="package"></i>
      <span>المنتجات</span>
    </button>
    <button class="nav-item">
      <i data-lucide="settings"></i>
      <span>الإعدادات</span>
    </button>
  </nav>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
